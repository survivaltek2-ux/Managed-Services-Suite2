services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: siebert_services
      POSTGRES_USER: siebert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siebert -d siebert_services"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://siebert:${POSTGRES_PASSWORD:-changeme}@db:5432/siebert_services
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PARTNER_PORTAL_URL: ${PARTNER_PORTAL_URL:-}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CLIENT_ID: ${STRIPE_CLIENT_ID:-}
      PARTNERSTACK_PUBLIC_KEY: ${PARTNERSTACK_PUBLIC_KEY:-}
      PARTNERSTACK_SECRET_KEY: ${PARTNERSTACK_SECRET_KEY:-}
      PARTNERSTACK_WEBHOOK_SECRET: ${PARTNERSTACK_WEBHOOK_SECRET:-}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      ZOOM_PHONE_NUMBER: ${ZOOM_PHONE_NUMBER:-}
      ZOOM_WS_SUBSCRIPTION_ID: ${ZOOM_WS_SUBSCRIPTION_ID:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .env:/app/.env:ro

volumes:
  postgres_data:
