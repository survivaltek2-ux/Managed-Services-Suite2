# Siebert Services — nginx virtual-host configuration
#
# Usage:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/siebert-services
#   sudo ln -sfn /etc/nginx/sites-available/siebert-services \
#                /etc/nginx/sites-enabled/siebert-services
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace APP_PORT (default 8080) and YOUR_DOMAIN with real values.
# Run `certbot --nginx -d YOUR_DOMAIN` afterwards to add HTTPS.

upstream siebert_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # Increase body size limit for file uploads
    client_max_body_size 25M;

    # Proxy timeouts
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;

    # WebSocket support (used by Zoom / live features)
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forward real client IP
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Route everything through the Node app
    location / {
        proxy_pass http://siebert_app;
    }

    # Cache static assets served by Node (Vite build outputs include
    # content-hashed filenames so long TTLs are safe)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        proxy_pass http://siebert_app;
        proxy_cache_bypass $http_pragma;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
